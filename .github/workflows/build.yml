name: Build Kernel with Patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_DIR: kernel_source
      PATCH_DIR: patches
      OUT_DIR: out
      ARCH: arm64

    steps:
    - name: 🛒 Checkout Repository
      uses: actions/checkout@v4

    - name: 🧬 Clone Kernel Source
      run: |
       git clone https://github.com/biki786-rgb/android_kernel_realme_sdm710.git
   cd android_kernel_realme_sdm710
    - name: 🩹 Apply Patches
      run: |
        for patch in $PATCH_DIR/*.patch; do
          if ! git -C $KERNEL_DIR apply "$patch"; then
            echo "❌ Failed to apply patch: $patch"
            exit 1
          fi
        done

    - name: ⚙️ Build Kernel
      run: |
        cd $KERNEL_DIR
        make O=../$OUT_DIR ARCH=$ARCH your_defconfig
        make O=../$OUT_DIR ARCH=$ARCH -j$(nproc)

    - name: 📦 Upload Flashable Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Flashable-ZIP V1
        path: $OUT_DIR/arch/arm64/boot/Image.gz-dtb