name: Kernel Build with Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu bc

      - name: Apply patches
        run: |
          for patch in patches/*.patch; do
            git apply "$patch"
          done

      - name: Build kernel modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out modules

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: out/**/*.ko